name: release
# On every push to main (or by hand): .github/scripts/release_skills.sh releases each skill folder
# changed since its last release, versioned from the newest entry of its README version notes
# (vX.Y): "<skill>-vX.Y.0" when X.Y went up, "<skill>-vX.Y.(Z+1)" when only READMEs changed; a
# SKILL.md or prompt.md change without a higher X.Y fails without releasing (rules in
# scripts/versions.py). The last release is found by commit order among the old date tags
# "<skill>-vYYYY.MM.DD[.N]" and the new tags. A full run (no skills given) also releases the whole
# kit as prompt-kit-vX.Y.Z.zip, versioned from the root READMEs, when skills/, the root READMEs or
# LICENSE changed, with every skill's zip as <skill>.zip; it is marked latest.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skills:
        description: "Only these skills (folder names, space separated; empty for all)"
        required: false
        default: ""
      force:
        description: "Release unchanged skills too (as a README-only change)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check
        run: |
          python scripts/check_skills.py
          python scripts/versions.py check
      - name: Release changed skills
        env:
          SKILLS: ${{ inputs.skills }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          OUT_DIR: ${{ runner.temp }}/release
        run: |
          # SKILLS is unquoted on purpose: one argument per folder name
          bash .github/scripts/release_skills.sh $SKILLS
